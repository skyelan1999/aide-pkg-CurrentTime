<!doctype html><html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>时间工作台</title><style>/* CSS */</style></head><body><div class="app"><header class="masthead"><div class="identity"><span class="seal" aria-hidden="true">时</span><div><h1>时间 <span>WORLD CLOCK</span></h1><p>同一时刻，连接不同时区</p></div></div><div class="header-meta"><button id="theme" class="quiet" type="button" aria-label="切换明暗主题">明 / 暗</button></div></header><p id="notice" role="status" aria-live="polite">正在连接主机时间…</p><main id="content"><section class="panel clock-panel"><div class="calendar-heading"><div><p class="eyebrow">AIDE 主机时间</p><h2 id="zone-title">等待校准</h2></div><button id="sync" type="button">立即校准</button></div><div class="zone-form"><label for="zone">显示时区</label><input id="zone" list="zones" placeholder="例如 Asia/Shanghai" autocomplete="off"><datalist id="zones"><option value="Asia/Shanghai"><option value="UTC"><option value="Asia/Tokyo"><option value="Europe/London"><option value="America/New_York"><option value="Asia/Kolkata"></datalist><button id="apply-zone" type="button">切换</button></div><div id="clock" class="clock" aria-label="当前时间">--:--:--</div><p id="clock-date" class="clock-date"></p><p id="sync-status" class="muted"></p><dl class="facts" id="clock-facts"></dl><p class="muted">基准来自 Aide 主机系统时钟，不是当前 SSH 设备。显示由主机时间推算，每30秒校准；未连接网络授时服务，不保证系统时钟已校准。</p></section><section class="panel"><p class="eyebrow">同一时刻</p><h2>时区对照</h2><div id="world-clocks" class="world-clocks"></div><details class="more" open><summary>ISO 周次查询</summary><div class="zone-form"><label for="week-date">公历日期</label><input id="week-date" type="date" required><button id="week-go" type="button">查询</button></div><p id="week-result" class="week-result" role="status"></p><p class="muted">周一为一周开始；跨年日期可能属于上一年或下一年的周。</p></details></section></main><footer class="page-footer">离线工具 · 时区与周次查询和 Aide 同源 · 关闭工作台后停止刷新</footer></div><script>/* BRIDGE */</script><script>/* JS */</script></body></html>
