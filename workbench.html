*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}button,input{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 13px;min-height:36px}button:hover{background:var(--hover)}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--focus);outline-offset:3px}button[aria-busy=true]{opacity:.6}.app{max-width:1360px;margin:0 auto;padding:32px 38px}.masthead,.identity,.header-meta,.calendar-heading,.month-actions,.day-heading,.calendar-footer{display:flex;align-items:center;gap:12px}.masthead{justify-content:space-between;margin-bottom:26px}.identity{gap:14px}.seal{display:grid;place-items:center;width:47px;height:52px;background:var(--accent);color:var(--surface);border-radius:12px 12px 4px 4px;font:27px Georgia,serif}h1{margin:0;font:600 24px/1.3 Georgia,"Songti SC",serif;letter-spacing:2px}h1 span{font:10px system-ui;letter-spacing:2.5px;margin-left:8px;color:var(--muted)}.identity p{font-size:11px;color:var(--muted);margin:6px 0 0;letter-spacing:2px}.zone{font-size:11px;color:var(--muted)}.quiet{background:none;color:var(--muted);font-size:12px}#notice{padding:10px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:16px;font-size:12px;color:var(--muted)}#notice[hidden]{display:none}#content{display:grid;grid-template-columns:minmax(360px,1.08fr) minmax(340px,1fr);align-items:start;gap:22px}#content[aria-busy=true]{opacity:.65}.panel{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:25px;min-width:0}.calendar-heading{justify-content:space-between;gap:8px}.eyebrow{font-size:10px;letter-spacing:1.4px;color:var(--muted);margin:0 0 8px}h2{font:600 25px/1.3 Georgia,"Songti SC",serif;margin:0;letter-spacing:1px}.month-actions{gap:6px}.month-actions button{padding:6px 11px}.month-actions button:first-child,.month-actions button:last-child{font-size:22px;line-height:1}#date-form{display:flex;align-items:center;gap:9px;margin:23px 0 24px}#date-form label{font-size:11px;color:var(--muted);flex:none}#date{min-width:0;flex:1;width:150px;border:1px solid var(--line);background:var(--surface);padding:7px 9px;border-radius:8px;min-height:36px}#go{font-size:12px}.weekdays,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekdays{font-size:11px;color:var(--muted);text-align:center;margin-bottom:10px}.weekdays span:nth-last-child(-n+2){color:var(--accent)}.days button{position:relative;min-width:0;padding:8px 1px 10px;border:1px solid transparent;min-height:67px;border-radius:11px;background:transparent;display:flex;flex-direction:column;align-items:center;gap:5px}.days button:hover{background:var(--hover)}.days .number{font-size:19px;line-height:1.1;font-variant-numeric:tabular-nums}.days .lunar{max-width:100%;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.days .term .lunar{color:var(--good)}.days .today{border-color:var(--accent)}.days button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}.days button[aria-pressed=true] .lunar{color:var(--accent)}.days .term::after{content:"";position:absolute;bottom:4px;width:3px;height:3px;background:var(--good);border-radius:50%}.calendar-footer{font-size:10px;color:var(--muted);gap:14px;justify-content:space-between;padding-top:18px;margin-top:14px;border-top:1px solid var(--line)}.calendar-footer span{display:flex;align-items:center;gap:5px}.today-dot,.term-dot{width:5px;height:5px;background:var(--accent);border-radius:50%;display:inline-block}.term-dot{background:var(--good)}.solar-note{margin-top:24px;padding:18px 0 0;border-top:1px solid var(--line);display:flex;align-items:center;gap:15px}.solar-icon{color:var(--accent);font-size:34px;font-weight:200}.solar-note .eyebrow{font-size:10px}.solar-note p{font-size:13px;margin:3px 0}.day-heading{justify-content:space-between;gap:10px;padding-bottom:20px;border-bottom:1px solid var(--line)}#daily-title{font-size:27px}#lunar-title{font-size:12px;color:var(--muted);margin:10px 0 0}#day-number{font:normal 69px/.95 Georgia,serif;letter-spacing:-4px;color:var(--accent);font-variant-numeric:tabular-nums}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0}.tag{background:var(--hover);border-radius:5px;padding:3px 7px;color:var(--muted);font-size:11px}.yi-ji{display:grid;grid-template-columns:1fr 1fr;gap:12px}.yi-ji section{padding:14px;border-radius:11px;min-width:0}.yi{background:var(--good-bg);color:var(--good)}.ji{background:var(--bad-bg);color:var(--bad)}h3{font-size:11px;font-weight:500;margin:0 0 12px}h3 span{font:600 20px Georgia,serif;margin-right:6px}.chips{display:flex;gap:6px 10px;flex-wrap:wrap;font-size:12px;line-height:1.8}.facts{margin:20px 0 0;font-size:12px}.facts>div{display:grid;grid-template-columns:65px 1fr;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}.facts dt{color:var(--muted)}.facts dd{margin:0;overflow-wrap:anywhere}.more{margin-top:15px}.more summary{font-size:12px;color:var(--muted);cursor:pointer;padding:6px 0}.more .facts{margin-top:0}.page-footer{color:var(--muted);font-size:10px;margin:25px 0 0;line-height:1.8}.page-footer>span{letter-spacing:1px}.page-footer p{margin:8px 0 4px}.page-footer small{font-size:10px}

</style></head><body><div class="app"><header class="masthead"><div class="identity"><span class="seal" aria-hidden="true">时</span><div><h1>时间 <span>WORLD CLOCK</span></h1><p>同一时刻，连接不同时区</p></div></div><div class="header-meta"><button id="theme" class="quiet" type="button" aria-label="切换明暗主题">明 / 暗</button></div></header><p id="notice" role="status" aria-live="polite">正在连接主机时间…</p><main id="content"><section class="panel clock-panel"><div class="calendar-heading"><div><p class="eyebrow">AIDE 主机时间</p><h2 id="zone-title">等待校准</h2></div><button id="sync" type="button">立即校准</button></div><div class="zone-form"><label for="zone">显示时区</label><input id="zone" list="zones" placeholder="例如 Asia/Shanghai" autocomplete="off"><datalist id="zones"><option value="Asia/Shanghai"><option value="UTC"><option value="Asia/Tokyo"><option value="Europe/London"><option value="America/New_York"><option value="Asia/Kolkata"></datalist><button id="apply-zone" type="button">切换</button></div><div id="clock" class="clock" aria-label="当前时间">--:--:--</div><p id="clock-date" class="clock-date"></p><p id="sync-status" class="muted"></p><dl class="facts" id="clock-facts"></dl><p class="muted">基准来自 Aide 主机系统时钟，不是当前 SSH 设备。显示由主机时间推算，每30秒校准；未连接网络授时服务，不保证系统时钟已校准。</p></section><section class="panel"><p class="eyebrow">同一时刻</p><h2>时区对照</h2><div id="world-clocks" class="world-clocks"></div><details class="more" open><summary>ISO 周次查询</summary><div class="zone-form"><label for="week-date">公历日期</label><input id="week-date" type="date" required><button id="week-go" type="button">查询</button></div><p id="week-result" class="week-result" role="status"></p><p class="muted">周一为一周开始；跨年日期可能属于上一年或下一年的周。</p></details></section></main><footer class="page-footer">离线工具 · 时区与周次查询和 Aide 同源 · 关闭工作台后停止刷新</footer></div><script>'use strict';
// Bundle this source into a plugin HTML. Never load parent credentials or arbitrary host URLs.
(function(){
 function create(pluginId){
  if(typeof pluginId!=='string'||!/^[A-Za-z0-9_-]{1,64}$/.test(pluginId))throw Error('Invalid plugin id');
  let port=null,tools=[],capabilities=[],next=0,connecting=null,settle=null,closed=false;const pending=new Map(),listeners=new Set();
  const revoke=reason=>{closed=true;port?.close();port=null;for(const p of pending.values()){clearTimeout(p.timer);p.reject(Error(reason));}pending.clear();if(settle){settle.reject(Error(reason));clearTimeout(settle.timer);settle=null;}window.removeEventListener('message',receive);};
  function receive(e){const m=e.data;if(closed||port||e.source!==window.parent||m?.type!=='aide.workbench.connect'||m.protocol!==1||m.pluginId!==pluginId||!Array.isArray(m.tools)||m.tools.some(x=>typeof x!=='string')||e.ports?.length!==1)return;
   port=e.ports[0];tools=m.tools.slice();capabilities=Array.isArray(m.capabilities)?m.capabilities.filter(x=>typeof x==='string').slice(0,16):[];port.onmessage=event=>{const value=event.data;if(value?.event==='scope.revoked'){revoke('Host scope revoked; verify effects before retry');return;}if(value?.event){for(const listener of listeners)listener(value);return;}const p=pending.get(value?.requestId);if(!p)return;pending.delete(value.requestId);clearTimeout(p.timer);if(value.status==='error')p.reject(Error(value.error||'Host call failed'));else p.resolve(value);};port.start();clearTimeout(settle?.timer);settle?.resolve({protocol:1,tools:tools.slice(),capabilities:capabilities.slice()});settle=null;
  }
  window.addEventListener('message',receive);
  function connect(){if(closed)return Promise.reject(Error('Client closed'));if(port)return Promise.resolve({protocol:1,tools:tools.slice(),capabilities:capabilities.slice()});if(!connecting){connecting=new Promise((resolve,reject)=>{settle={resolve,reject,timer:setTimeout(()=>revoke('Host bridge unavailable'),10000)};});window.parent.postMessage({type:'aide.workbench.ready',protocol:1,requestIds:'monotonic'},'*');}return connecting;}
  async function request(method,body){await connect();if(closed||!port)throw Error('Bridge closed');if(pending.size)throw Error('A call is already pending');const requestId='r_'+(++next);return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{pending.delete(requestId);reject(Error('Reply timeout; outcome uncertain, do not automatically retry'));},320000);pending.set(requestId,{resolve,reject,timer});try{port.postMessage({protocol:1,requestId,method,...body});}catch(e){pending.delete(requestId);clearTimeout(timer);reject(e);}});}
  return {connect,async call(tool,args={},attachments=[]){await connect();if(!tools.includes(tool))throw Error('Tool not declared by this workbench');return request('tool.call',{tool,arguments:args,attachments});},proposalStatus:proposalId=>request('proposal.status',{proposalId}),onEvent(fn){listeners.add(fn);return()=>listeners.delete(fn);},close(){revoke('Client closed; verify effects before retry');}};
 }
 window.AideWorkbenchClient={create};
})();
</script><script>'use strict';
(()=>{const $=id=>document.getElementById(id),bridge=AideWorkbenchClient.create('current-time');let clock=null,anchor=0,busy=false,disposed=false,timer,painter;const zones=['Asia/Shanghai','UTC','America/New_York','Europe/London','Asia/Tokyo'];
const node=(tag,cls,text)=>{const e=document.createElement(tag);e.className=cls||'';if(text!==undefined)e.textContent=text;return e;},notice=text=>{if(disposed)return;$('notice').textContent=text;$('notice').hidden=!text;};
async function call(tool,args){const r=await bridge.call(tool,args);if(r.status!=='result')throw Error('未收到工具结果');return r.result;}
function fields(now,zone){const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(now).map(p=>[p.type,p.value]));return {date:`${p.year}-${p.month}-${p.day}`,time:`${p.hour}:${p.minute}:${p.second}`};}
function render(){if(disposed||!clock)return;const now=new Date(clock.unixMs+Math.max(0,performance.now()-anchor)),f=fields(now,clock.timeZone);$('clock').textContent=f.time;$('clock-date').textContent=f.date;$('world-clocks').replaceChildren();for(const zone of zones){const t=fields(now,zone),row=node('div','world-clock');row.append(node('span','',zone),node('strong','',t.time),node('small','muted',t.date));$('world-clocks').append(row);}}
async function sync(zone){if(disposed)return;if(busy){clearTimeout(timer);timer=setTimeout(()=>sync(clock?.timeZone),1000);return;}busy=true;$('sync').disabled=$('apply-zone').disabled=true;const began=performance.now();try{const q=await call('get_current_datetime',zone?{timeZone:zone}:{});if(disposed)return;fields(new Date(q.unixMs),q.timeZone);clock=q;anchor=performance.now();$('zone').value=q.timeZone;$('zone-title').textContent=q.timeZone;$('sync-status').textContent='最近校准 '+q.time+' · 往返 '+Math.round(anchor-began)+' ms';$('clock-facts').replaceChildren();for(const [label,value]of [['UTC',q.isoUtc],['主机时区',q.runtimeTimeZone],['当前周次',q.isoWeek.weekYear+' · W'+String(q.isoWeek.weekNumber).padStart(2,'0')]]){const row=node('div');row.append(node('dt','',label),node('dd','',value));$('clock-facts').append(row);}if(!$('week-date').value)$('week-date').value=q.date;notice('');render();}catch(e){notice('校准失败：'+e.message+'。'+(clock?'仍按上次主机时间推算。':''));}finally{busy=false;if(!disposed)$('sync').disabled=$('apply-zone').disabled=false;clearTimeout(timer);if(!disposed)timer=setTimeout(()=>sync(clock?.timeZone),30000);}}
$('sync').onclick=()=>sync(clock?.timeZone);$('apply-zone').onclick=()=>{if(!$('zone').value.trim()){notice('请输入IANA时区，例如Asia/Shanghai');return;}void sync($('zone').value.trim());};$('zone').onkeydown=e=>{if(e.key==='Enter')$('apply-zone').click();};$('week-go').onclick=async()=>{if(disposed||busy||!$('week-date').reportValidity())return;busy=true;$('week-go').disabled=true;try{const q=await call('get_week_number',{date:$('week-date').value,timeZone:clock?.timeZone||'UTC'});if(!disposed)$('week-result').textContent=`${q.weekYear} 年第 ${q.weekNumber} 周 · ${q.weekStart} 至 ${q.weekEnd}`;}catch(e){notice('周次查询失败：'+e.message);}finally{busy=false;if(!disposed)$('week-go').disabled=false;}};
$('theme').onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';function theme(e){if(e.source!==parent||e.data?.type!=='aide.workbench.theme'||e.data.protocol!==1)return;document.documentElement.dataset.theme=e.data.theme==='dark'?'dark':'light';document.documentElement.dataset.palette=e.data.palette;}
function stop(){disposed=true;clearTimeout(timer);clearInterval(painter);for(const e of document.querySelectorAll('main button,main input'))e.disabled=true;}
addEventListener('message',theme);parent.postMessage({type:'aide.workbench.theme.ready',protocol:1},'*');bridge.onEvent(e=>{if(e.event==='scope.revoked'){notice('工作区或授权已变化，时钟已停止，请重新打开');stop();}});addEventListener('pagehide',()=>{stop();removeEventListener('message',theme);bridge.close();});painter=setInterval(render,250);void sync();})();
</script></body></html>
